name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: out/
          remote_path: ${{ secrets.CLOUDWAYS_APP_PATH }}/public_html/
          remote_host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SSH_USER }}
          remote_key: ${{ secrets.CLOUDWAYS_SSH_KEY }}

      - name: Purge Varnish cache over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          username: ${{ secrets.CLOUDWAYS_SSH_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          script: |
            set -eu
            APP_PUBLIC_PATH="${{ secrets.CLOUDWAYS_APP_PATH }}/public_html"
            PURGE_HOST="${{ secrets.CLOUDWAYS_VARNISH_HOST }}"
            CUSTOM_PURGE_COMMAND="${{ secrets.CLOUDWAYS_VARNISH_PURGE_COMMAND }}"

            if [ -z "$PURGE_HOST" ]; then
              PURGE_HOST="${{ secrets.CLOUDWAYS_PRIMARY_DOMAIN }}"
            fi

            if [ -z "$PURGE_HOST" ]; then
              echo "CLOUDWAYS_VARNISH_HOST (or CLOUDWAYS_PRIMARY_DOMAIN) is required for PURGE host header."
              exit 1
            fi

            if [ ! -d "$APP_PUBLIC_PATH" ]; then
              echo "App public_html path not found: $APP_PUBLIC_PATH"
              exit 1
            fi

            echo "Purging Varnish cache for host: $PURGE_HOST"
            if [ -n "$CUSTOM_PURGE_COMMAND" ]; then
              echo "Running custom purge command from CLOUDWAYS_VARNISH_PURGE_COMMAND"
              sh -lc "$CUSTOM_PURGE_COMMAND"
              exit 0
            fi

            html_count=0
            purge_ok=0
            html_list="$(mktemp)"
            find "$APP_PUBLIC_PATH" -type f -name '*.html' > "$html_list"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              html_count=$((html_count + 1))

              rel="${file#"$APP_PUBLIC_PATH"}"
              route="${rel%.html}"
              if [ "$route" = "/index" ]; then
                route="/"
              else
                route="${route%/index}"
              fi
              if [ -z "$route" ]; then
                route="/"
              fi

              if curl -fsS -X PURGE "http://127.0.0.1$route" -H "Host: $PURGE_HOST" >/dev/null; then
                purge_ok=1
              fi
            done < "$html_list"
            rm -f "$html_list"

            if [ "$html_count" -eq 0 ]; then
              echo "No HTML files found to purge in $APP_PUBLIC_PATH"
            fi

            # Always purge root as a final fallback.
            if curl -fsS -X PURGE "http://127.0.0.1/" -H "Host: $PURGE_HOST" >/dev/null; then
              purge_ok=1
            fi

            if [ "$purge_ok" -eq 0 ]; then
              echo "No Varnish PURGE requests succeeded."
              exit 1
            fi

            echo "Varnish purge completed."
