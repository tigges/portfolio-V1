name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: out/
          remote_path: ${{ secrets.CLOUDWAYS_APP_PATH }}/public_html/
          remote_host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SSH_USER }}
          remote_key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
